spring:
  application:
    name: novel-script-backend
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/novel_script?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql

server:
  port: 8080

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
