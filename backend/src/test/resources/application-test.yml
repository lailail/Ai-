spring:
  datasource:
    url: jdbc:h2:mem:novel_script;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql

novel-script:
  adaptation:
    async-enabled: false
  ai:
    deepseek:
      enabled: false
    prompt:
      location: classpath:prompts/
